[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "tyro",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10,<8",
    "dill",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["rlm"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage/coverage.xml"
