[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "tyro",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10,<8",
    "dill",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

# rlm.workflow_v2 validates against the closed Workflow V2 schema at run
# time; the wheel ships it inside the package (a source checkout reads
# schemas/ directly).
[tool.hatch.build.targets.wheel.force-include]
"schemas/workflow-v2.schema.json" = "rlm/schemas/workflow-v2.schema.json"

[tool.coverage.run]
branch = true
relative_files = true
source = ["rlm"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage/coverage.xml"
