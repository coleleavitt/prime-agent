# Kernel-side package for the bundled tasks skill. It is pure Python: the task
# list is a JSON file in the session's artifact directory (RLM_SESSION_DIR), so
# it needs no host request and no dependency beyond the standard library.
[project]
name = "tasks"
version = "0.1.0"
description = "Prime Agent tasks skill: a persistent per-session task list for multi-step work"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasks"]
