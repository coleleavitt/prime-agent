# Kernel-side package for the bundled code-review skill. Pure Python over the
# runtime's rlm.workflow API and the git CLI; no dependency beyond the
# standard library.
[project]
name = "code-review"
version = "0.1.0"
description = "Prime Agent code-review skill: Claude Code's /code-review recipes as a multi-agent workflow"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review"]
