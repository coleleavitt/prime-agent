[project]
name = "prime-agent-skill-present-artifact"
version = "0.1.0"
description = "Present on-disk artifacts to the user without attaching them to the model's context."
requires-python = ">=3.10"
dependencies = ["pillow>=10.0.0", "prime-agent-runtime"]

[project.scripts]
present_artifact = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/present_artifact"]
