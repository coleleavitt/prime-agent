[package]
name = "pa-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claude Code-compatible command hooks: settings-configured commands on session start, prompts, tool calls (the kernel's bash() as Bash), and run ends."

[dependencies]
pa-core = { path = "../pa-core" }
pa-agent = { path = "../pa-agent" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
regex = "1"
# `http` hooks; the same reqwest and TLS features pa-core resolves.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
pa-types = { path = "../pa-types" }

[lints]
workspace = true
