[package]
name = "pa-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The failure ledger and the resolution index: fingerprinted runtime failures, recurrence, and the cell that fixed a failure before."

[dependencies]
pa-core = { path = "../pa-core" }
pa-agent = { workspace = true }
pa-types = { workspace = true }
pa-telemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = "1"
sha2 = "0.10"
getrandom = "0.3"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = "3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
