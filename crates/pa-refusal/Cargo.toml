[package]
name = "pa-refusal"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
md5 = "0.7"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
