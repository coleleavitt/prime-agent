[package]
name = "pa-computer-use"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The computer-use skill's host side: policy, permissions, observation, input and capture for macOS, X11 and Wayland (niri)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
regex = "1"
uuid = { version = "1", features = ["v4"] }
# The user-edited allowlist is TOML (the Python skill used `tomllib`); no
# workspace crate parses TOML. `preserve_order` keeps `[risk]` in file order.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }

[target.'cfg(unix)'.dependencies]
# The hardened capture directory: `openat(O_NOFOLLOW)` chains, `fstatat`,
# `unlinkat` and `fchmodat` through one verified directory descriptor (the
# Python module's `dir_fd` calls), plus the keymap memfd on Wayland.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Wayland backend's AT-SPI client: pure Rust over D-Bus, replacing the
# Python skill's PyGObject + libatspi (which needed the gobject-introspection
# and cairo headers to build). The blocking proxies run on the host's
# blocking pool.
atspi-proxies = "0.14"
zbus = "5"
# The virtual pointer (wlr) and keyboard (misc) protocols the Python skill
# spoke by hand over the Wayland socket.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS backend binds AppKit (workspace, pasteboard), HIServices (AX),
# CoreGraphics (events, window list, session, screen-capture preflight) and
# Vision through the objc2 family, replacing the Python skill's pyobjc.
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFArray", "CFDictionary", "CFNumber", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSData", "NSDictionary", "NSBundle", "NSURL", "NSError", "NSObject", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSPasteboard"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXValue", "AXError"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "libc", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGSession", "CGWindow"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# The fake compositor receives the keymap fd as SCM_RIGHTS ancillary data.
rustix = { version = "1", features = ["fs", "net"] }

[lints.rust]
# Denied, not forbidden: the macOS platform module binds AppKit,
# ApplicationServices, CoreGraphics and Vision through objc2, whose
# out-parameter and CF calls are `unsafe`; that one module allows it, every
# block carries a `// SAFETY:` invariant, and nothing else may.
unsafe_code = "deny"

