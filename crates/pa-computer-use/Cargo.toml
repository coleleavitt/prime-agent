[package]
name = "pa-computer-use"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The computer-use skill's host side: policy, permissions, observation, input and capture for macOS, X11 and Wayland (niri)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
regex = "1"
uuid = { version = "1", features = ["v4"] }
# The user-edited allowlist is TOML (the Python skill used `tomllib`); no
# workspace crate parses TOML. `preserve_order` keeps `[risk]` in file order.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }

[target.'cfg(unix)'.dependencies]
# The hardened capture directory: `openat(O_NOFOLLOW)` chains, `fstatat`,
# `unlinkat` and `fchmodat` through one verified directory descriptor (the
# Python module's `dir_fd` calls), plus the keymap memfd on Wayland.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
# Denied, not forbidden: the macOS platform module binds AppKit,
# ApplicationServices, CoreGraphics and Vision through objc2, whose
# out-parameter and CF calls are `unsafe`; that one module allows it, every
# block carries a `// SAFETY:` invariant, and nothing else may.
unsafe_code = "deny"

[lints.clippy]
pedantic = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
