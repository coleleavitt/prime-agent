[package]
name = "pa-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI for Prime Agent."

[dependencies]
pa-types = { path = "../pa-types" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
unicode-properties = "0.1"
unicode-segmentation = "1"
fancy-regex = "0.14"
url = "2"
regex = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
anyhow = "1"
base64 = "0.22"
# The presented-artifact preview on kitty-protocol terminals: kitty only accepts PNG
# (`f=100`), and the kernel re-encodes oversized previews as JPEG, so the preview is
# decoded once off the paint path and re-sent as PNG (zlib via the existing flate2).
zune-jpeg = "0.5.15"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "pa-tui-replay"
path = "src/bin/pa-tui-replay.rs"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
proptest = { workspace = true }

[lints]
workspace = true
