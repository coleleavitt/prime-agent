[package]
name = "pa-os-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS-level confinement of the Python kernel and the commands it runs: Landlock + seccomp on Linux, Seatbelt on macOS."

[dependencies]
thiserror.workspace = true

# The launcher's `setsid` (safe wrapper; already in the graph through
# pa-bash and pa-types, so no new crate).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Landlock (filesystem + TCP rules) and seccomp (non-unix socket denial) are
# Linux kernel interfaces; nothing else links them.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# `deny`, not the workspace's `forbid`: exactly one module
# (`linux::syscalls`) opts back in with `#[allow(unsafe_code)]` for the
# fork/exec hook (the fallback when no launcher is registered) and the ABI
# probe, each block under a `// SAFETY:` note.
# `forbid` could not be lifted there, and `deny` keeps every other module
# of this crate as unsafe-free as the rest of the workspace.
unsafe_code = "deny"

[lints.clippy]
# The clippy rows mirror the workspace table (this crate keeps its own
# lints table for the `unsafe_code` row above).
pedantic = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"

# The launcher end to end: this test binary is its own launcher (its `main`
# dispatches the hidden flag), so it needs its own entry point.
[[test]]
name = "launcher"
harness = false
