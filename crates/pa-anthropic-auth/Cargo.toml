[package]
name = "pa-anthropic-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anthropic subscription auth through the shared anthropic-rs account store (~/.anthropic-accounts), shared with the opencode and pi plugins."

[dependencies]
# The shared store, its claimed refresh and the Claude Code link: the SDK the
# opencode and pi plugins use through anthropic-napi (vendor/anthropic, pinned;
# see vendor/anthropic/PRIME_AGENT_PATCH.md). `store` + `client` only: no
# loopback login server, federation, keyring or device keys.
anthropic = { path = "../../vendor/anthropic", default-features = false, features = ["store", "client"] }
pa-core = { path = "../pa-core" }
pa-types.workspace = true
pa-telemetry.workspace = true
# The store's API takes chrono instants (the version anthropic resolves).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
tokio.workspace = true
tracing.workspace = true
# The id of an imported login without an identity (`account-<8 hex>`, as
# anthropic-napi names it).
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pa-agent.workspace = true
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
