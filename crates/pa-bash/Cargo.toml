[package]
name = "pa-bash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel bash(): the shell command checker (refusal guards) and the job runner the host executes commands with."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pa-os-sandbox = { path = "../pa-os-sandbox" }
fancy-regex = "0.14"
getrandom = "0.3"

# Safe wrappers for what std cannot express without `unsafe`: a new session
# for the child (POSIX `setsid` between fork and exec) and Windows job objects
# entered while the child is still suspended.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-session", "job-object", "creation-flags"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "event"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
