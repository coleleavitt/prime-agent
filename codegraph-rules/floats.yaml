# Float parsing where byte/behaviour parity with the TS (JavaScript) product matters.
id: pa-float-parse-js-parity
description: >-
  Text is parsed to a float with Rust's parser (`s.parse::<f64>()`,
  `f64::from_str`, `serde_json::from_str::<f64>`). It does not agree with the
  JavaScript the TS product used: `Number(s)` trims whitespace, reads `""`
  as 0 and `0x1f` as hex, and only spells infinity `Infinity`, while Rust
  rejects the first three and also accepts `inf`, `infinity` and `nan` in any
  case; `parseFloat` reads a numeric prefix (`"12px"` is 12). Separately,
  serde_json without its `float_roundtrip` feature parses decimal numbers
  best-effort (1 ULP off for many shortest-round-trip values such as
  `499.57400010000003`), so a TS-written number re-serialized from Rust can
  change bytes. Check which JS function the TS source used at this site.
severity: low
tags: [parity, float]
language: rust
check-patterns:
  - name: turbofish-parse
    query: |
      ((call_expression
         function: (generic_function
           function: (field_expression field: (field_identifier) @m)
           type_arguments: (type_arguments) @ty)) @call
       (#eq? @m "parse")
       (#match? @ty "^<\\s*f(32|64)\\s*>$"))
    at: call
    where:
      - enclosing-function:
          is-test: false
  - name: from-str-float
    query: |
      ((call_expression
         function: [(scoped_identifier path: (_) @path name: (identifier) @fn)
                    (generic_function
                      function: (scoped_identifier path: (_) @path name: (identifier) @fn)
                      type_arguments: (type_arguments) @ty)]) @call
       (#match? @fn "^from_str$"))
    at: call
    where:
      - capture: call
        regex: "^(f32|f64)::from_str|from_str::<\\s*f(32|64)\\s*>"
      - enclosing-function:
          is-test: false
message: "float parsed with Rust semantics where the TS product used JavaScript's"
review:
  - What did the TS do here (`Number`, `parseFloat`, `JSON.parse`, `+x`)? Do whitespace, `""`, hex, `inf`/`nan` and prefixes behave the same?
  - Is the value re-serialized into a TS-format file or digest? Then the parse must be correctly rounded.
examples:
  bad:
    - |
      fn score(raw: &str) -> Option<f64> { raw.trim().parse::<f64>().ok() }
    - |
      fn ratio(raw: &str) -> Option<f64> { serde_json::from_str::<f64>(raw).ok() }
    - |
      fn ratio(raw: &str) -> Option<f64> { f64::from_str(raw).ok() }
  good:
    - |
      fn count(raw: &str) -> Option<u64> { raw.parse::<u64>().ok() }
    - |
      #[test]
      fn parses() { assert_eq!("1.5".parse::<f64>().unwrap(), 1.5); }
