# Test-isolation hazards: tests in one binary run on parallel threads and share
# the process (environment, fd table, process-wide registries).
id: pa-test-env-mutation-without-lock
description: >-
  A test mutates the process environment (`std::env::set_var`/`remove_var`)
  in a function that takes no env lock. Every test in the binary shares one
  environment: a concurrent test reading the same variable (or the code under
  test reading it) sees the other test's value. The repo serializes these on
  a lock (`config::env_lock()`, `packages::test_support::lock_env()`,
  `test_support::TELEMETRY_ENV_MUTEX`, a module's `env_lock()`), usually
  through a guard type that takes it.
severity: low
tags: [flaky, test-isolation]
language: rust
check-patterns:
  - name: set-or-remove-var
    query: |
      ((call_expression
         function: (scoped_identifier path: (_) @path name: (identifier) @fn)) @call
       (#match? @path "(^|::)env$")
       (#match? @fn "^(set_var|remove_var)$"))
    at: call
    where:
      - enclosing-function:
          is-test: true
          calls-not: "(?i)env_lock|lock_env|env_mutex|ENV_LOCK|ENV_MUTEX|EnvGuard|EnvVarGuard|ScopedEnv|with_env|lock$"
      # A guard type's apply/drop: whoever builds the guard holds the lock.
      - not-inside: "(impl_item) @impl"
message: "test calls `env::{fn}` without holding an env lock"
review:
  - Does a caller (or a guard constructed earlier in the test) hold the crate's env lock?
  - Does any other test in the same binary read or write this variable?
examples:
  bad:
    - |
      #[test]
      fn reads_the_key() {
          std::env::set_var("PRIME_API_KEY", "k");
          assert_eq!(key(), "k");
      }
  good:
    - |
      #[test]
      fn reads_the_key() {
          let _env = env_lock();
          std::env::set_var("PRIME_API_KEY", "k");
          assert_eq!(key(), "k");
      }
    - |
      fn main() { std::env::set_var("RUST_LOG", "info"); }
    - |
      impl Drop for EnvOverride {
          fn drop(&mut self) { std::env::remove_var("PA_X"); }
      }
---
id: pa-test-proc-self-fd-number
description: >-
  A test judges a file descriptor by its number under `/proc/self/fd`. The fd
  table is process-wide: once the fd is closed, another test thread can be
  handed the same number at once, so "the number is gone" (or "the number
  still exists") says nothing about this test's descriptor. Compare the link
  target (`socket:[inode]`, the file path) instead.
severity: low
tags: [flaky, test-isolation]
language: rust
check-patterns:
  - name: proc-self-fd-path
    query: |
      ((string_literal) @lit
       (#match? @lit "/proc/self/fd"))
    at: lit
    where:
      - enclosing-function:
          is-test: true
message: "test inspects /proc/self/fd by number"
review:
  - Does the test conclude anything from the number alone (exists / vanished / count)? Another thread may reuse it.
examples:
  bad:
    - |
      #[test]
      fn closes_fd() {
          let fd = listener.as_raw_fd();
          drop(listener);
          assert!(std::fs::read_link(format!("/proc/self/fd/{fd}")).is_err());
      }
  good:
    - |
      fn open_fds() -> usize { std::fs::read_dir("/proc/self/fd").map(|d| d.count()).unwrap_or(0) }
---
id: pa-test-global-count-assertion
description: >-
  A test asserts an exact count on a process-wide registry (a free
  `*_count()` / `live_*()` / `active_*()` accessor, or the `.len()` of a
  `static`/global registry). Other tests in the same binary register and
  release entries concurrently, so the count is not this test's to assert;
  ask whether this test's own entry is present instead.
severity: low
tags: [flaky, test-isolation]
language: rust
check-patterns:
  - name: assert-eq-on-global-count
    query: |
      ((macro_invocation macro: (identifier) @mac (token_tree) @args) @call
       (#match? @mac "^(assert_eq|assert_ne|assert)$"))
    at: call
    where:
      # A free (path-less receiver) call to a count-like accessor with no arguments,
      # or the len() of a registry()/REGISTRY global.
      - capture: args
        regex: "(^|[^\\w.:])(\\w+::)*(live_\\w+_count|\\w+_count|count_live\\w*|active_\\w+|live_\\w+)\\(\\s*\\)|(registry|REGISTRY|GLOBAL\\w*|global\\w*)\\(\\)[\\s\\S]{0,80}\\.len\\(\\)"
      - enclosing-function:
          is-test: true
message: "test asserts an exact process-wide count"
review:
  - Is the counted registry process-wide (a static, a OnceLock, a global accessor)?
  - Can another test in the same binary add or remove entries concurrently?
examples:
  bad:
    - |
      #[tokio::test]
      async fn registry_tracks_kernels() {
          add(&manager.inner);
          assert_eq!(live_kernel_count(), 1);
      }
    - |
      #[test]
      fn registers() {
          register("x");
          assert_eq!(registry().lock().unwrap().len(), 1);
      }
  good:
    - |
      #[test]
      fn counts_own_items() {
          let items = vec![1, 2];
          assert_eq!(items.len(), 2);
          assert_eq!(tree.node_count(), 3);
      }
---
id: pa-test-git-without-isolation
description: >-
  A test spawns `git` directly instead of through the shared fixture helper
  (`pa_core::git_env::{fixture_git, run_fixture_git}`, pa-core's
  `test_support::run_git`, pa-bash's `test_support::{git, run_git}`). Git
  exports `GIT_DIR`, `GIT_WORK_TREE` and their siblings to hooks and
  `git rebase --exec` commands; a test started from one inherits them, and a
  bare `Command::new("git").current_dir(tempdir)` then acts on that outer
  repository: `git init --bare` re-initialized a real checkout's `.git` as
  bare, `git config user.*` added a `[user]` section to it, and fixture
  commits and branches landed in its history. The helper scrubs the
  repository selection and isolates user/system config.
severity: medium
tags: [test-isolation, data-loss]
language: rust
check-patterns:
  - name: literal-git-spawn
    query: |
      ((call_expression
         function: (scoped_identifier path: (_) @ty name: (identifier) @ctor)
         arguments: (arguments . (string_literal) @program .)) @call
       (#match? @ty "(^|::)Command$")
       (#eq? @ctor "new")
       (#eq? @program "\"git\""))
    at: call
    where:
      # Test helpers (`fn git(..)` beside the tests) are plain functions, so the
      # rule does not require `is-test`; product code that honours an exported
      # `GIT_DIR` on purpose is listed in the README.
      - enclosing-function:
          calls-not: "fixture_git|run_fixture_git|isolate_fixture|scrub_repository_selection|env_clear|env_remove"
message: "`git` spawned with the inherited GIT_DIR/GIT_WORK_TREE (no fixture helper, no scrub)"
review:
  - Does this git run in a fixture the test owns? Build it with `fixture_git`/`run_fixture_git` (or the crate's `test_support::git`).
  - Does it deliberately exercise an inherited repository selection? Then set `GIT_DIR` explicitly on the command.
  - In product code, does the call act on a directory the caller owns (scrub with `pa_core::git_env::scrub_repository_selection`) or on the user's behalf in their shell environment (honour it, and list the site in the README)?
examples:
  bad:
    - |
      fn git(dir: &Path, args: &[&str]) {
          let status = std::process::Command::new("git").args(args).current_dir(dir).status().unwrap();
          assert!(status.success());
      }
    - |
      #[test]
      fn commits_in_a_fixture() {
          let dir = tempfile::tempdir().unwrap();
          std::process::Command::new("git").args(["init", "-q"]).current_dir(dir.path()).status().unwrap();
      }
  good:
    - |
      #[test]
      fn commits_in_a_fixture() {
          let dir = tempfile::tempdir().unwrap();
          pa_core::git_env::run_fixture_git(dir.path(), &["init", "-q"]);
      }
    - |
      fn head(dir: &Path) -> io::Result<Output> {
          let mut command = Command::new("git");
          scrub_repository_selection(&mut command);
          command.arg("rev-parse").current_dir(dir).output()
      }
---
id: pa-test-spawn-without-state-isolation
description: >-
  A test spawns a workspace binary (`CARGO_BIN_EXE_*`) without
  `pa_types::platform::test_isolation::TestState`. The child then resolves
  its agent dir, `auth.json`, the shared Anthropic account store, Claude
  Code's credentials and the kernel venv from the environment the test
  inherited: a `cargo test` started from a prime-agent session inherits the
  session's `PRIME_AGENT_CODING_AGENT_DIR`, and 32 spawned binaries that set
  `HOME` but not the agent dir traced into the real `~/.prime/agent/logs`,
  read the real `auth.json` and flushed the real harness ledger.
  `TestState::new(root).apply(&mut command)` (or `for_agent_dir`) points all
  of them under the test's temp dir and scrubs the inherited redirects; the
  binary's startup guard refuses a real-state path, but only isolation keeps
  the test hermetic.
severity: medium
tags: [test-isolation, data-loss]
language: rust
check-patterns:
  - name: bin-exe-spawn
    query: |
      ((call_expression
         function: (scoped_identifier path: (_) @ty name: (identifier) @ctor)
         arguments: (arguments) @args) @call
       (#match? @ty "(^|::)Command$")
       (#eq? @ctor "new"))
    at: call
    where:
      - capture: args
        not-regex: "^\\(\\s*\"[^\"]*\"\\s*\\)$"
      - enclosing-function:
          contains: |
            ((string_literal) @bin (#match? @bin "CARGO_BIN_EXE_"))
          # `PROTECTED_HOME_ENV`: a guard test that leaks on purpose, against a sentinel home.
          contains-not: |
            ([(identifier) (type_identifier)] @state (#match? @state "^(TestState|PROTECTED_HOME_ENV)$"))
message: "workspace binary spawned without TestState: it resolves the inherited agent dir and auth stores"
review:
  - Does the command get `TestState::new(<temp root>).apply(&mut command)` (or `for_agent_dir`) before its own `.env(..)` calls?
  - Is the state applied in a caller or a wrapper (a `timeout`/`sh` launcher whose env reaches the binary)?
examples:
  bad:
    - |
      #[test]
      fn rpc_resumes() {
          let home = tempfile::TempDir::new().unwrap();
          let child = Command::new(env!("CARGO_BIN_EXE_prime-agent"))
              .env("HOME", home.path())
              .spawn()
              .unwrap();
      }
    - |
      fn spawn_daemon(agent_dir: &Path) -> Child {
          let binary = env!("CARGO_BIN_EXE_pa-daemon");
          Command::new(binary).arg("--agent-dir").arg(agent_dir).spawn().unwrap()
      }
  good:
    - |
      fn spawn_daemon(agent_dir: &Path) -> Child {
          let binary = env!("CARGO_BIN_EXE_pa-daemon");
          TestState::for_agent_dir(agent_dir)
              .apply(&mut Command::new(binary))
              .arg("--agent-dir")
              .arg(agent_dir)
              .spawn()
              .unwrap()
      }
    - |
      fn fixture(dir: &Path) {
          let bin = env!("CARGO_BIN_EXE_prime-agent");
          Command::new("git").arg("init").current_dir(dir).status().unwrap();
      }
---
id: pa-test-engine-on-resolved-agent-dir
description: >-
  Test code hands an engine (or any config with an `agent_dir` field) the
  agent dir resolved from the environment (`agent_dir()`,
  `get_agent_dir()`, `home_dir()`) instead of a temp dir it owns. That is
  the user's real `~/.prime/agent` whenever the test runs with the real
  `HOME` or an inherited `PRIME_AGENT_CODING_AGENT_DIR`: the engine then
  reads the real `auth.json` and writes the real logs, sessions and harness.
  The resolvers panic on a real-state path in test processes; give the engine
  an explicit temp agent dir.
severity: medium
tags: [test-isolation, data-loss]
language: rust
check-patterns:
  - name: resolved-agent-dir-field
    query: |
      ((field_initializer
         field: (field_identifier) @field
         value: (_) @value) @init
       (#eq? @field "agent_dir"))
    at: init
    where:
      - capture: value
        regex: "(^|::)(agent_dir|get_agent_dir|home_dir)\\(\\)"
      - enclosing-function:
          is-test: true
message: "test engine built on the environment-resolved agent dir"
review:
  - Is the value a temp dir the test owns? Use it (`tempfile`, `TestState::agent_dir`).
examples:
  bad:
    - |
      #[tokio::test]
      async fn engine_starts() {
          let config = SessionEngineConfig {
              agent_dir: pa_types::platform::agent_dir().unwrap(),
              cwd,
          };
      }
  good:
    - |
      #[tokio::test]
      async fn engine_starts() {
          let tmp = tempfile::tempdir().unwrap();
          let config = SessionEngineConfig {
              agent_dir: tmp.path().join("agent"),
              cwd,
          };
      }
