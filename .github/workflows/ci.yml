name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trust:
    name: Contributor trust
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ github.event_name == 'push' || steps.vouch.outputs.vouched == 'true' }}
    steps:
      - name: Check pull request author
        id: vouch
        if: github.event_name == 'pull_request'
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1
        with:
          user: ${{ github.event.pull_request.user.login }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-check:
    name: Build and check
    needs: trust
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

  test:
    name: Test (${{ matrix.name }})
    needs: trust
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-core
            package: packages/agent
            command: npm run test:coverage
            coverage_file: packages/agent/coverage/lcov.info
            coverage_prefix: packages/agent/
            install_uv: false
          - name: ai
            package: packages/ai
            command: npm run test:coverage
            coverage_file: packages/ai/coverage/lcov.info
            coverage_prefix: packages/ai/
            install_uv: false
          - name: tui
            package: packages/tui
            command: npm run test:coverage
            coverage_file: packages/tui/coverage/lcov.info
            coverage_prefix: packages/tui/
            install_uv: false
          - name: coding-agent 1/3
            package: packages/coding-agent
            command: npm run test:coverage -- --shard=1/3
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: coding-agent 2/3
            package: packages/coding-agent
            command: npm run test:coverage -- --shard=2/3
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: coding-agent 3/3
            package: packages/coding-agent
            command: npm run test:coverage -- --shard=3/3
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: coding-agent process supervisor
            package: packages/coding-agent
            command: npm run test:coverage:process-supervisor
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: coding-agent process singleton
            package: packages/coding-agent
            command: npm run test:coverage:process-singleton
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: coding-agent process recovery
            package: packages/coding-agent
            command: npm run test:coverage:process-recovery
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: coding-agent process update
            package: packages/coding-agent
            command: npm run test:coverage:process-update
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: coding-agent kernel
            package: packages/coding-agent
            command: npm run test:coverage:kernel
            coverage_file: packages/coding-agent/coverage/lcov.info
            coverage_prefix: packages/coding-agent/
            install_uv: true
          - name: runtime python
            package: prime-agent-runtime
            command: uv run coverage run -m unittest discover -s test && uv run coverage xml
            coverage_file: prime-agent-runtime/coverage/coverage.xml
            coverage_prefix: prime-agent-runtime/
            install_uv: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install uv
        if: matrix.install_uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.command }}

      - name: Normalize coverage paths
        env:
          COVERAGE_FILE: ${{ matrix.coverage_file }}
          COVERAGE_PREFIX: ${{ matrix.coverage_prefix }}
        run: |
          if [[ "$COVERAGE_FILE" == *.info ]]; then
            sed -i "s|^SF:|SF:$COVERAGE_PREFIX|" "$COVERAGE_FILE"
          else
            sed -i "s|filename=\"|filename=\"$COVERAGE_PREFIX|g" "$COVERAGE_FILE"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.coverage_file }}
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage
    needs: [trust, test]
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: Archive merged coverage inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: coverage-reports
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          directory: coverage-reports
          fail_ci_if_error: true
          use_oidc: true
          version: v11.2.8

  build-check-test:
    name: build-check-test
    if: always() && needs.trust.outputs.allowed == 'true'
    needs: [trust, build-check, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$BUILD_CHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
