# An example Prime Agent WebAssembly plugin, built for `wasm32-wasip2` (see
# README.md). Its own workspace: it is not part of the agent's build.
[workspace]

[package]
name = "command-guard"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Example Prime Agent plugin: a guard over the commands the agent runs."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to releases past the repository's 7-day minimum age.
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = "s"
lto = true
strip = true
